<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Campus Circular</title><desc id="desc">A campus resource-sharing platform built with JavaScript, Canvas, and Node.js.</desc><defs><linearGradient id="bg" x1="20" y1="15" x2="560" y2="240"><stop stop-color="#4A1D18"/><stop offset="1" stop-color="#3B164A"/></linearGradient><radialGradient id="g"><stop stop-color="#FB7185" stop-opacity=".4"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><style>.orb{animation:drift 5s ease-in-out infinite alternate}.arrow{animation:nudge 1.4s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(22px,-14px)}}@keyframes nudge{to{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){.orb,.arrow{animation:none}}</style></defs><rect width="580" height="250" rx="24" fill="url(#bg)"/><circle class="orb" cx="508" cy="44" r="122" fill="url(#g)"/><text x="38" y="48" fill="#FDA4AF" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="3">MISSION 04 · COMMUNITY TECH</text><text x="38" y="100" fill="#FFF" font-family="Inter,Segoe UI,sans-serif" font-size="33" font-weight="800">Campus Circular</text><text x="38" y="135" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="16">Borrow nearby. Share smarter. Waste less.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700"><rect x="38" y="164" width="96" height="30" rx="15" fill="#BE123C"/><text x="86" y="184" text-anchor="middle" fill="#FFF">JAVASCRIPT</text><rect x="142" y="164" width="70" height="30" rx="15" fill="#9D174D"/><text x="177" y="184" text-anchor="middle" fill="#FFF">CANVAS</text><rect x="220" y="164" width="70" height="30" rx="15" fill="#7E22CE"/><text x="255" y="184" text-anchor="middle" fill="#FFF">NODE.JS</text></g><text class="arrow" x="38" y="226" fill="#FDA4AF" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">DISCOVER THE PLATFORM  →</text><rect x="1" y="1" width="578" height="248" rx="23" stroke="#FB7185" stroke-opacity=".35" stroke-width="2"/></svg>
