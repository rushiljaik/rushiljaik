<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">CampusAI ERP</title><desc id="desc">A multi-role college platform built with React, Vite, and Tailwind CSS.</desc><defs><linearGradient id="bg" x1="20" y1="10" x2="560" y2="240"><stop stop-color="#24104F"/><stop offset="1" stop-color="#102A63"/></linearGradient><radialGradient id="g"><stop stop-color="#A78BFA" stop-opacity=".45"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><style>.orb{animation:drift 5s ease-in-out infinite alternate}.arrow{animation:nudge 1.4s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-28px,18px)}}@keyframes nudge{to{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){.orb,.arrow{animation:none}}</style></defs><rect width="580" height="250" rx="24" fill="url(#bg)"/><circle class="orb" cx="515" cy="38" r="120" fill="url(#g)"/><text x="38" y="48" fill="#C4B5FD" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="3">MISSION 01 · WEB PLATFORM</text><text x="38" y="100" fill="#FFF" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">CampusAI ERP</text><text x="38" y="135" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="16">One campus. Three roles. A complete experience.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700"><rect x="38" y="164" width="70" height="30" rx="15" fill="#7C3AED"/><text x="73" y="184" text-anchor="middle" fill="#FFF">REACT</text><rect x="116" y="164" width="58" height="30" rx="15" fill="#4F46E5"/><text x="145" y="184" text-anchor="middle" fill="#FFF">VITE</text><rect x="182" y="164" width="92" height="30" rx="15" fill="#0E7490"/><text x="228" y="184" text-anchor="middle" fill="#FFF">TAILWIND</text></g><text class="arrow" x="38" y="226" fill="#67E8F9" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">EXPLORE PROJECT  →</text><rect x="1" y="1" width="578" height="248" rx="23" stroke="#A78BFA" stroke-opacity=".35" stroke-width="2"/></svg>
