<svg width="1200" height="92" viewBox="0 0 1200 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rushil's creative signal</title><desc id="desc">An animated neon signal reading build, experiment, learn, ship.</desc>
  <defs><linearGradient id="line" x1="80" y1="46" x2="1120" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED" stop-opacity="0"/><stop offset=".2" stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset=".8" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient><style>.pulse{animation:pulse 2.8s ease-in-out infinite}.dot{animation:travel 4s linear infinite}@keyframes pulse{50%{opacity:.55}}@keyframes travel{from{transform:translateX(-470px)}to{transform:translateX(470px)}}@media(prefers-reduced-motion:reduce){.pulse,.dot{animation:none}}</style></defs>
  <rect width="1200" height="92" rx="20" fill="#0B1020"/><path d="M70 46H1130" stroke="url(#line)" stroke-width="2"/><circle class="dot" cx="600" cy="46" r="5" fill="#67E8F9"/><g class="pulse" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3"><text x="220" y="52" fill="#C4B5FD">BUILD</text><text x="410" y="52" fill="#67E8F9">EXPERIMENT</text><text x="690" y="52" fill="#C4B5FD">LEARN</text><text x="960" y="52" fill="#67E8F9">SHIP</text></g><rect x="1" y="1" width="1198" height="90" rx="19" stroke="#A78BFA" stroke-opacity=".18" stroke-width="2"/>
</svg>
