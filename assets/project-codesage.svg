<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">CodeSage-AI</title><desc id="desc">An intelligent pull-request review platform built with Python, FastAPI, React, and LLMs.</desc><defs><linearGradient id="bg" x1="20" y1="10" x2="560" y2="240"><stop stop-color="#063B35"/><stop offset="1" stop-color="#14213D"/></linearGradient><radialGradient id="g"><stop stop-color="#34D399" stop-opacity=".42"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><style>.orb{animation:drift 5s ease-in-out infinite alternate}.arrow{animation:nudge 1.4s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-22px,-16px)}}@keyframes nudge{to{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){.orb,.arrow{animation:none}}</style></defs><rect width="580" height="250" rx="24" fill="url(#bg)"/><circle class="orb" cx="515" cy="48" r="120" fill="url(#g)"/><text x="38" y="48" fill="#6EE7B7" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="3">MISSION 03 · AI ENGINEERING</text><text x="38" y="100" fill="#FFF" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">CodeSage-AI</text><text x="38" y="135" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="16">Smarter reviews. Safer code. Better pull requests.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700"><rect x="38" y="164" width="72" height="30" rx="15" fill="#047857"/><text x="74" y="184" text-anchor="middle" fill="#FFF">PYTHON</text><rect x="118" y="164" width="78" height="30" rx="15" fill="#0F766E"/><text x="157" y="184" text-anchor="middle" fill="#FFF">FASTAPI</text><rect x="204" y="164" width="54" height="30" rx="15" fill="#6D28D9"/><text x="231" y="184" text-anchor="middle" fill="#FFF">LLMs</text></g><text class="arrow" x="38" y="226" fill="#6EE7B7" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">REVIEW THE SYSTEM  →</text><rect x="1" y="1" width="578" height="248" rx="23" stroke="#34D399" stroke-opacity=".35" stroke-width="2"/></svg>
