<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Stay curious and keep building</title><desc id="desc">A neon closing banner encouraging visitors to ship something remarkable.</desc><defs><linearGradient id="bg" x1="100" y1="20" x2="1100" y2="135"><stop stop-color="#1E1B4B"/><stop offset=".5" stop-color="#172554"/><stop offset="1" stop-color="#083344"/></linearGradient><linearGradient id="text" x1="300" y1="40" x2="900" y2="110"><stop stop-color="#C4B5FD"/><stop offset=".5" stop-color="#FFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient><style>.star{animation:twinkle 1.8s ease-in-out infinite alternate}.s2{animation-delay:-.8s}@keyframes twinkle{to{opacity:.25;transform:scale(.65)}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style></defs><rect width="1200" height="150" rx="26" fill="url(#bg)"/><g fill="#67E8F9"><circle class="star" cx="110" cy="45" r="3"/><circle class="star s2" cx="1060" cy="98" r="4"/><circle class="star" cx="1010" cy="35" r="2"/><circle class="star s2" cx="170" cy="115" r="2"/></g><text x="600" y="68" text-anchor="middle" fill="url(#text)" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="800">STAY CURIOUS · KEEP BUILDING</text><text x="600" y="108" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="16" letter-spacing="3">SHIP SOMETHING REMARKABLE</text><rect x="1" y="1" width="1198" height="148" rx="25" stroke="#67E8F9" stroke-opacity=".2" stroke-width="2"/></svg>
