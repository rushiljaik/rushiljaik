<svg width="580" height="250" viewBox="0 0 580 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">RGB Gaming Keyboard</title><desc id="desc">An interactive 3D keyboard built with JavaScript and Three.js.</desc><defs><linearGradient id="bg" x1="30" y1="10" x2="550" y2="245"><stop stop-color="#062B3A"/><stop offset="1" stop-color="#29115A"/></linearGradient><radialGradient id="g"><stop stop-color="#22D3EE" stop-opacity=".4"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><style>.orb{animation:drift 5s ease-in-out infinite alternate}.arrow{animation:nudge 1.4s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(20px,18px)}}@keyframes nudge{to{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){.orb,.arrow{animation:none}}</style></defs><rect width="580" height="250" rx="24" fill="url(#bg)"/><circle class="orb" cx="500" cy="42" r="125" fill="url(#g)"/><text x="38" y="48" fill="#67E8F9" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="3">MISSION 02 · CREATIVE CODE</text><text x="38" y="100" fill="#FFF" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="800">3D RGB Keyboard</text><text x="38" y="135" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="16">Type it. Orbit it. Explode it. Export it.</text><g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700"><rect x="38" y="164" width="96" height="30" rx="15" fill="#0E7490"/><text x="86" y="184" text-anchor="middle" fill="#FFF">JAVASCRIPT</text><rect x="142" y="164" width="86" height="30" rx="15" fill="#6D28D9"/><text x="185" y="184" text-anchor="middle" fill="#FFF">THREE.JS</text><rect x="236" y="164" width="62" height="30" rx="15" fill="#4338CA"/><text x="267" y="184" text-anchor="middle" fill="#FFF">WEBGL</text></g><text class="arrow" x="38" y="226" fill="#67E8F9" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">ENTER THE EXPERIENCE  →</text><rect x="1" y="1" width="578" height="248" rx="23" stroke="#22D3EE" stroke-opacity=".35" stroke-width="2"/></svg>
